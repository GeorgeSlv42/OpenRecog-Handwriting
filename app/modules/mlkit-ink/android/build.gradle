plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mlkitink'
version = '0.1.0'

android {
  namespace "expo.modules.mlkitink"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Keep in sync with MLKIT_VERSION.android in ../index.ts.
  implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'
}
